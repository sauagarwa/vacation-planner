[project]
name = "vacation-planner"
version = "0.1.0"
description = "Vacation planner using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=1.6.1",
    "fastapi==0.115.8",
    "langgraph>=0.2.0",
    "mcp>=1.26.0",
    "openai==1.63.0",
    "requests==2.32.5",
    "uvicorn==0.34.0"
]

[project.scripts]
agentic_ai = "agent.crewai.main:run"
run_crew = "agent.crewai.main:run"
train = "agent.crewai.main:train"
replay = "agent.crewai.main:replay"
test = "agent.crewai.main:test"
run_with_trigger = "agent.crewai.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
