[project]
name = "vacation-planner"
version = "0.1.0"
description = "Vacation planner using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]==1.4.1",
    "fastapi==0.115.8",
    "openai==1.63.0",
    "requests==2.32.5",
    "uvicorn==0.34.0"
]

[project.scripts]
vacation-planner = "vacation-planner.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
